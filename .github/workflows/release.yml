name: Release

# v ile baslayan bir etiket push'landiginda (ör. git tag v1.0.0 && git push origin v1.0.0)
# derleyici uc isletim sisteminde derlenir, testlerden gecerse GitHub Release olusturulur.
# Elle calistirma (workflow_dispatch) yalnizca derler ve test eder, yayinlamaz.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            bin: build/ssn
          - os: macos-latest
            name: macos-arm64
            bin: build/ssn
          - os: windows-latest
            name: windows-x64
            bin: build/Release/ssn.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Testler
        shell: bash
        run: bash tests/run_tests.sh ${{ matrix.bin }}

      - name: Paketle
        shell: bash
        run: |
          paket="ssn-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir -p "dist/$paket"
          cp ${{ matrix.bin }} README.md README.tr.md LICENSE "dist/$paket/"
          cp -r tests/ornekler "dist/$paket/ornekler"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$paket.zip" "$paket" > /dev/null
          else
            tar -czf "$paket.tar.gz" "$paket"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub Release olustur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "SSN $GITHUB_REF_NAME" \
            --generate-notes
