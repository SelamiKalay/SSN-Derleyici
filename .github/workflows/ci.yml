name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derleyiciyi derle (CMake)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Web IDE derleyicisini derle
        run: g++ -std=c++17 -O2 -o build/ssn-web web-ide/compiler.cpp

      - name: Testler — ssn
        run: bash tests/run_tests.sh build/ssn

      - name: Testler — web IDE derleyicisi
        run: bash tests/run_tests.sh build/ssn-web
